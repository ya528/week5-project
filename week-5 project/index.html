<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Week 5 Internship Capstone: Single Page Application (SPA) simulation with client-side routing, History API state management, dynamic view rendering, and smooth UI transitions." />
  <title>NexusSPA — Single Page Application Simulation</title>
  <link rel="stylesheet" href="src/styles.css" />
  <script src="src/app.js" defer></script>
</head>
<body>
  <a href="#spa-outlet" class="skip-link">Skip to application content</a>

  <div class="app-shell">
    <!-- Persistent Top Header & Route Navigation -->
    <header class="topbar">
      <div class="container topbar-inner">
        <a href="#/" class="brand" data-route="/">
          <span class="brand-mark" aria-hidden="true">NX</span>
          <span>NexusSPA</span>
        </a>

        <button
          type="button"
          class="nav-toggle"
          id="navToggleBtn"
          aria-expanded="false"
          aria-controls="spaNav"
          aria-label="Toggle navigation menu"
        >
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>

        <nav class="spa-nav" id="spaNav" aria-label="SPA Views">
          <ul class="nav-menu">
            <li><a href="#/" class="nav-link" data-route="/">Overview</a></li>
            <li><a href="#/modules" class="nav-link" data-route="/modules">Modules</a></li>
            <li><a href="#/workspace" class="nav-link" data-route="/workspace">Workspace</a></li>
            <li><a href="#/architecture" class="nav-link" data-route="/architecture">Architecture</a></li>
          </ul>
        </nav>

        <div class="route-pill" aria-live="polite" title="Active Client Route">
          <span class="route-dot" aria-hidden="true"></span>
          <span id="routeBadge">#/</span>
        </div>
      </div>
    </header>

    <!-- Dynamic View Container -->
    <main id="spa-outlet" class="spa-outlet" tabindex="-1" aria-live="polite"></main>

    <!-- Persistent Footer -->
    <footer class="app-footer">
      <div class="container footer-row">
        <p><strong>NexusSPA</strong> &mdash; Week 5 Internship SPA Simulation (HTML5, CSS3 &amp; Vanilla JS History/Hash Routing).</p>
        <p class="footer-hint">Use navigation links or browser Back/Forward controls to test state transitions.</p>
      </div>
    </footer>
  </div>
</body>
</html>
